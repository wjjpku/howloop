name: Verify reviewer reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-plot.txt
      - run: python scripts/verify_integrity.py
      - run: python reproduce.py
      - run: python scripts/audit_results.py
      - run: python scripts/audit_parity_phase.py
      - run: python experiments/revision/audit_paper_matched.py
      - run: python experiments/revision/mechanism_aggregate.py
