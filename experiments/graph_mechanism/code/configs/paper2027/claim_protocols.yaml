schema_version: 1
paper: reusable-computation-compatible-interfaces
statistical_contract:
  top_level_unit: independently_trained_backbone_seed
  nested_units: [controller_seed_within_backbone, graph_or_sequence_within_controller]
  final_test_policy: locked_once_after_protocol_freeze
  uncertainty: hierarchical_bootstrap_backbone_controller_cluster_10000
  responder_policy: report_every_completed_registered_backbone; controller replicas are nested within backbone

protocols:
  graph_g1_phenotype:
    claim_level: behavioral
    status: planned_confirmatory
    task: N8 directed graph successor
    backbone:
      architecture: two shared pre-LN Transformer layers; d_model=256; 4 heads; MLP=1024
      training: final-only successor CE at recurrent call 8
      training_horizon: 8
    seeds: {backbone: [100, 111]}
    evaluation:
      max_boundary: 128
      cluster: graph_permutation_with_all_eight_starts
      primary_metrics: [post_horizon_successor_auc, recurrence_phenotype]
    claim_boundary: Same-population phenotype evidence only; controller efficacy is tested separately.

  graph_g2_interface:
    claim_level: causal_role
    status: planned_confirmatory
    parent_protocol: graph_g1_phenotype
    intervention: matched same-graph/same-current/same-phase interface replacement before frozen executor
    controls: [raw_late_next, wrong_current, cross_graph, shuffled_donor, norm_matched_random, immediate_readout]
    evaluation_boundaries: [16, 32, 64]
    primary_metrics: [next_successor_logit_margin, exact_match]
    pass_criterion: matched-young improves over late and all matched controls in paired hierarchical analysis
    claim_boundary: Does not identify a scalar age variable or a complete circuit.

  graph_g3_controller:
    claim_level: behavioral_and_causal_role
    status: planned_confirmatory
    parent_protocol: graph_g1_phenotype
    controller:
      form: J(h)=h(D+AB)+b
      rank: 48
      initialization: identity
      placement: one loop boundary before frozen executor
      objective: pure on-policy successor CE
      training_controlled_calls: [1, 16]
      controller_seeds_per_backbone: 2
    heldout:
      strict_horizon_ood_calls: [17, 64]
      stress_calls: [65, 128]
    controls: [raw, D_only, no_AB, identity_D, AB_only, no_bias, mean_D, shuffle_D, spectrum_matched_random_delta, executor_off]
    primary_metrics: [delta_auc_calls_17_64, reliable_horizon_q90, backbone_success_fraction]
    claim_boundary: Finite backbone-dependent continuation only; no universal recurrence claim.

  graph_g4_disjoint:
    claim_level: behavioral_and_causal_role
    status: complete_confirmatory
    task: N8 permutation graph successor
    backbone:
      architecture: two shared pre-LN Transformer layers; d_model=256; 4 heads; MLP=1024
      training: final-only successor CE at recurrent call 8
      training_horizon: 8
      seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111]
    split:
      selection_lock: 512 unique permutation graphs
      final_lock: 512 unique permutation graphs, zero overlap with selection lock
      train_policy: every backbone and controller batch rejects both immutable locks by encoded permutation identity
      final_test_policy: final-lock SHA-256 must match checkpoint and controller exclusion records
    controller:
      form: J(h)=h(D+AB)+b
      rank: 48
      initialization: exact identity with one live low-rank gradient factor
      objective: pure on-policy successor CE at calls 1..16
      controller_seeds_per_backbone: 2
      selection: selection-lock successor CE only; no final-lock qualification
    evaluation:
      calls: [1, 128]
      cluster: unique graph permutation with all eight starts
      primary_metrics: [strict_successor_auc_calls_9_128, endpoint_hold_auc_calls_9_128]
      controls: [raw, executor_off, cross_graph_batch_shuffle, D_only, no_AB, identity_D, AB_only, no_bias, mean_D, shuffle_D, spectrum_matched_random_delta]
    claim_boundary: Finite controller-induced continuation on held-out graphs only; raw natural continuation and universal graph generalization are not claimed.

  parity_p1_input_once:
    claim_level: behavioral
    status: complete_confirmatory
    task: binary Parity
    backbone:
      architecture: causal NoPE; one shared Transformer layer; d_model=256; 64 heads; MLP=1024; final LayerNorm after each call
      input_injection: token embeddings only at call 1
      training: answer CE only at T(n)=n for lengths 1..20
    seeds: {backbone: [3, 14]}
    evaluation:
      lengths: [1, 500]
      metrics: [local_carrier_period, heldout_plane_energy, one_step_transition_r2, readout_plane_energy, phase_origin_slope, registered_accuracy_auc]
    claim_boundary: Near-four-call damped/sheared phase dynamics, not an exact four-state orbit unless four-step return and radial stability pass separately.

  parity_j1_input_once_adaptive_boundary:
    claim_level: exploratory_behavioral
    status: complete_audited_three_backbone_boundary_retiming
    task: binary Parity
    cohort:
      backbone_seeds: [0, 1, 2]
      relation_to_p2: Earlier independent input-once cohort; not the later prospective P2 gate.
    backbone:
      architecture: causal NoPE; one shared Transformer layer; d_model=256; 64 heads; MLP=1024; final LayerNorm after each call
      input_injection: token embeddings only at call 1
      training: answer CE only at T(n)=n for lengths 1..20
    controller:
      form: J(h)=h(D+AB)+b
      rank: 48
      initialization: identity
      placement: before every frozen executor call after the initial anchor call; never after the final call
      objective: final answer CE only; no hidden-state loss
      controller_seeds: {0: 411001, 1: 411002, 2: 411003}
      adaptive_training_ranges: {0: [80, 200], 1: [64, 128], 2: [48, 100]}
      selection: boundary validation plus retention at lengths 10 and 20
    evaluation:
      registered_readout: T(n)=n
      examples_per_length: 256
      first_doubling_rule: sampled lengths strictly above the controller training maximum and no larger than twice that maximum
      diagonal_band: {lengths: [1, 500], relative_depth: [-10, 10], examples_per_cell: 64}
      paired_batches: raw and controller use the same examples at every evaluation point
    completed_result: All three backbone/controller pairs improve exact match in their strict-OOD first-doubling band; the gains are finite, non-monotonic at longer horizons, and seed dependent.
    provenance_limitations: Training ranges were adapted after observing each backbone boundary, and the training runner did not archive an immutable source digest; evaluation code, result files, checkpoints, and remote hashes were audited.
    claim_boundary: Exploratory three-backbone evidence for finite phase/interface retiming after input-once correction. It is not an indefinite-locking result, a prospective population estimate, or a contradiction of the separate P2 single-backbone null.

  parity_p2_boundary_controller:
    claim_level: behavioral
    status: complete_registered_single_positive_backbone_null
    parent_protocol: parity_p1_input_once
    controller:
      form: J(h)=h(D+AB)+b
      rank: 48
      initialization: identity
      objective: final answer CE only
      controller_seeds_per_backbone: 2
    disease_rule: first validation length with registered accuracy below .90 and an adjacent +/-2 call exceeding it by at least .10
    primary_metrics: [absolute_phase_slope_error_reduction, registered_readout_ood_auc]
    controls: [raw, identity, random_affine, D_only, AB_only, executor_off, short_length_retention]
    completed_gate: {deep_backbones: [3, 4, 5], no_disease: [3, 4], disease_positive: [5], first_diseased_length: 92, fixed_training_range: [92, 184]}
    completed_result: Two rank-48, two rank-128, and two dense controller fits did not restore exact-match accuracy at the gate length; all six have zero exact match at length 92 under matched evaluation, with dense fits reaching at most 2/512.
    claim_boundary: A prospectively selected single-backbone null result. It rules out the tested capacity/training protocol as a sufficient Parity OOD repair; it is neither a population estimate nor an impossibility theorem.

  parity_p4_controller_mechanism:
    claim_level: descriptive_geometry_and_null_intervention
    status: complete_registered_single_positive_backbone_null
    parent_protocol: parity_p2_boundary_controller
    controller: selected rank-48 seed-1 P2 controller on backbone seed 5
    diagnostics: [heldout_two_dimensional_phase_fit, SVD_keep_delete_variants, local_hidden_effect_trace]
    completed_result: The controlled trajectory retains a near-four-call phase fit, but full-J and every registered SVD variant have zero target exact match at the P2 gate and later diagnostic lengths.
    claim_boundary: The phase fit is descriptive on a failed-controller trajectory. It cannot identify an efficacy-causal spectral subspace or establish a four-state orbit.

  parity_p3_phase_causality:
    claim_level: algorithmic_mechanism_test
    status: complete_registered_three_seed_null
    parent_protocol: parity_p1_input_once
    discovery_test_split: phase plane fit on discovery lengths; interventions only on held-out lengths
    interventions: [adjacent_call_phase_interchange, estimated_one_step_rotation, pi_over_2_rotation, pi_rotation, phase_plane_remove, phase_plane_keep]
    controls: [one_hundred_energy_matched_random_2d_planes, radius_matched_rotation, attention_skip, MLP_skip]
    primary_metrics: [readout_margin_change, phase_advance_change]
    completed_result: Across deep seeds 3/4/5, a pi rotation of the answer-token phase component has no consistent advantage over an equal-norm random-plane rotation after continued calls. MLP skip, unlike attention skip, leaves states closer to the preceding clean phase.
    claim_boundary: Full answer-token phase replacement is a positive patching control, not causal plane evidence. The failed rotation comparison downgrades the plane to descriptive geometry and supports only the MLP component-role observation.

  d8l6_s1_matched_selection:
    claim_level: behavioral_case_study
    status: complete_single_backbone_case_study
    task: D8L6 graph stage selection
    controller:
      parameterization: matched full-rank affine or matched rank
      initialization: identity
      objective: pure post-executor CE
      training_budget: identical across one-hop and two-hop conditions
    controls: [identity, no_prewrite, batch_shuffle, executor_off]
    primary_metrics: [post_executor_behavior_distribution, pre_executor_target_exposure]
    claim_boundary: Checkpoint-local stage reachability unless replicated across independently trained backbones.
