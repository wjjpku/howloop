name: Reproduce figures and statistics
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-plot.txt
      - run: python -m pip install -r requirements-plot.txt
      - run: python scripts/verify_integrity.py
      - run: python reproduce.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python scripts/audit_results.py
      - run: python scripts/audit_parity_phase.py
      - uses: actions/upload-artifact@v4
        with:
          name: v66-reproduction
          path: |
            outputs/figures/fig*.pdf
            outputs/figure_reproduction.json
            outputs/audit/audit_results.json
            outputs/parity_phase/verified_phase_table.json
